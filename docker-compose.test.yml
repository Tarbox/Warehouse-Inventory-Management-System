services:
  postgres-test:
    image: postgres:18
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: warehouse_test
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    volumes:
      - postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
