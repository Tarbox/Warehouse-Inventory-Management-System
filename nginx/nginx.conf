events {}

# one for the frontend service running on port 3000 and another for the backend service running on port 4000.
http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4000;
    }
# `$connection_upgrade` that determines the value of the `Connection` header based on the value of the `Upgrade` header in the incoming HTTP request. If the `Upgrade` header is present (indicating a WebSocket upgrade request), `$connection_upgrade` will be set to "upgrade". If the `Upgrade` header is not present, `$connection_upgrade` will be set to "close". This mapping is essential for handling WebSocket connections correctly in Nginx.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

    # Next.js development HMR WebSocket.
        location /_next/hmr {
    proxy_pass http://frontend/_next/hmr;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 1h;
}
        # Application realtime WebSocket.
        location /api/realtime {
            proxy_pass http://backend/api/realtime;

            proxy_http_version 1.1;
       
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 1h;
        }

        # Forward API requests to the backend.
        location /api/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other requests go to the frontend.
        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}