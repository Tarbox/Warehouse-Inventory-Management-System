name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: warehouse_test
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://warehouse:warehouse@localhost:5432/warehouse_test?schema=public
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: test_admin_password
      SEED_WORKER_PASSWORD: test_worker_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run test:ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config

      - name: Validate development Nginx
        run: |
          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -v "$PWD/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine nginx -t

      - name: Validate production Nginx
        run: |
          mkdir -p nginx/certs
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout nginx/certs/privkey.pem \
            -out nginx/certs/fullchain.pem \
            -days 1 \
            -subj "/CN=localhost"

          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -v "$PWD/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/certs:/etc/nginx/certs:ro" \
            nginx:alpine nginx -t

      - name: Build backend image
        run: docker build -t warehouse-inventory-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t warehouse-inventory-frontend:ci ./frontend
